# Self-hosted GitHub Actions runner, one compose project per org or per repo.
# Start through deskrunner.ps1 so the scope, target, token and project name are set for you.

services:
  runner:
    image: myoung34/github-runner:ubuntu-noble
    restart: unless-stopped
    # Time for a running job step to end. Runners are removed from GitHub by
    # deskrunner.ps1, not by the container.
    stop_grace_period: 30s
    environment:
      RUNNER_SCOPE: ${RUNNER_SCOPE:?Start runners through deskrunner.ps1}
      ORG_NAME: ${ORG_NAME:-}
      REPO_URL: ${REPO_URL:-}
      # A registration token fetched by deskrunner.ps1. It expires after one
      # hour and can only add a runner. Your GitHub token never enters the
      # container, because jobs could read it there.
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Start runners through deskrunner.ps1}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-desk}
      RANDOM_RUNNER_SUFFIX: "true"
      LABELS: ${RUNNER_LABELS:-deskrunner}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      # Do not add EPHEMERAL here, not even as "false": the image treats any
      # value as "on". An ephemeral runner removes itself after one job and
      # could not register again once the registration token has expired.
      DISABLE_AUTO_UPDATE: "true"
      # The container has no token that could remove the runner from GitHub;
      # deskrunner.ps1 does that from the host.
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
      # Keep the registration when the container restarts (for example after
      # Docker Desktop restarts), so a restart needs no new token.
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-config
      # Shared caches (named volumes below).
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      npm_config_cache: /cache/npm
      npm_config_store_dir: /cache/pnpm-store
      UV_CACHE_DIR: /cache/uv
      PIP_CACHE_DIR: /cache/pip
    tmpfs:
      # Must exist for CONFIGURED_ACTIONS_RUNNER_FILES_DIR. In memory, one per container.
      - /runner-config
    volumes:
      - toolcache:/opt/hostedtoolcache
      - cache:/cache
      # Docker access for jobs is opt-in: see compose.docker.yaml (-Docker).
    deploy:
      resources:
        limits:
          cpus: "${RUNNER_CPUS:-4}"
          memory: ${RUNNER_MEMORY:-6g}

# Fixed names so every target's runners share the same caches.
volumes:
  toolcache:
    name: deskrunner-toolcache
  cache:
    name: deskrunner-cache
